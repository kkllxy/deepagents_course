site_name: DeepAgents 快速开发入门
site_description: 从零掌握生产级 AI Agent 工程开发
site_author: DeepAgents Course
copyright: Copyright &copy; 2026 DeepAgents Course

# ── Theme ──────────────────────────────────────────────
theme:
  name: material
  language: zh
  features:
    - navigation.instant      # SPA-like navigation
    - navigation.tracking     # URL tracks active anchor
    - navigation.tabs         # Top-level nav as tabs
    - navigation.sections     # Group pages by section
    - navigation.expand       # Expand collapsible sections
    - navigation.indexes      # Attach index pages to sections
    - navigation.top          # Back-to-top button
    - search.suggest          # Search auto-suggest
    - search.highlight        # Highlight search results
    - search.share            # Share search link
    - content.code.copy       # Code copy button
    - content.code.annotate   # Code annotations
    - content.tooltips        # Rich tooltips
    - toc.follow              # Follow TOC on scroll
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: 切换到深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: 切换到浅色模式
  font:
    text: Noto Sans SC
    code: JetBrains Mono
  icon:
    repo: fontawesome/brands/github

# ── Plugins ────────────────────────────────────────────
plugins:
  - search:
      lang:
        - zh
        - en
      separator: '[\s\-\.]+'
  - tags

# ── Extensions ─────────────────────────────────────────
markdown_extensions:
  # Table of Contents
  - toc:
      permalink: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower

  # Tables
  - tables

  # Admonition (note, warning, tip, etc.)
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

  # Code highlighting
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets

  # Formatting extras
  - attr_list
  - md_in_html
  - def_list
  - footnotes
  - abbr

  # Task lists
  - pymdownx.tasklist:
      custom_checkbox: true

  # Emoji & icons
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

  # Tabs
  - pymdownx.tabbed:
      alternate_style: true

